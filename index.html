<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Giao Tiếp Tiếng Anh với Gemini</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5; color: #333; min-height: 100vh;
            display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .container { width: 100%; max-width: 640px; }
        .card {
            background: #fff; border-radius: 16px; padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 { font-size: 1.3rem; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; color: #1a1a1a; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #444; font-size: 0.95rem; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #ddd;
            background: #fafafa; font-size: 1rem; color: #333; transition: border 0.2s;
        }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #4f46e5; background: #fff; }
        .helper-text { font-size: 0.82rem; color: #888; margin-top: 6px; line-height: 1.4; }
        .helper-text a { color: #4f46e5; text-decoration: none; }
        .row-buttons { display: flex; gap: 10px; margin-bottom: 16px; }
        .btn {
            padding: 12px 18px; border-radius: 10px; border: none; font-size: 0.95rem;
            font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 6px;
        }
        .btn-primary { background: #4f46e5; color: #fff; flex: 1; }
        .btn-primary:hover { background: #4338ca; }
        .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
        .btn-secondary { background: #eef2ff; color: #4f46e5; }
        .btn-secondary:hover { background: #e0e7ff; }
        .btn-secondary:disabled { color: #aaa; cursor: not-allowed; }
        .btn-warn { background: #fef3c7; color: #92400e; }
        .btn-warn:hover { background: #fde68a; }

        .log-panel {
            background: #1e1e2f; border-radius: 8px; padding: 12px;
            font-family: 'Courier New', monospace; font-size: 0.75rem;
            color: #a29bfe; max-height: 320px; overflow-y: auto; margin-top: 16px;
            white-space: pre-wrap; word-break: break-all;
        }
        .log-line { margin-bottom: 4px; line-height: 1.4; }
        .log-error { color: #ff7675; }
        .log-success { color: #55efc4; }
        .log-info { color: #74b9ff; }
        .log-warning { color: #fdcb6e; }
        .log-raw { color: #dfe6e9; font-size: 0.7rem; }

        .chat-section { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .chat-section.active { display: block; }
        .status-bar {
            display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
            padding: 10px 14px; background: #f9fafb; border-radius: 8px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #status-text { font-size: 0.9rem; color: #666; flex: 1; }

        .transcript {
            height: 240px; overflow-y: auto; background: #fafafa; border-radius: 12px;
            padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column;
            gap: 10px; border: 1px solid #eee;
        }
        .message { padding: 10px 14px; border-radius: 12px; font-size: 0.92rem; line-height: 1.5; max-width: 85%; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background: #e5e7eb; color: #333; border-bottom-left-radius: 4px; }
        .message.system { align-self: center; background: transparent; color: #888; font-size: 0.82rem; font-style: italic; text-align: center; max-width: 100%; }

        .mic-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 16px; border-radius: 50px; border: none; background: #e5e7eb;
            color: #333; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .mic-btn:not(:disabled):hover { background: #d1d5db; }
        .mic-btn.active { background: #ef4444; color: #fff; box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        .reset-btn {
            padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd;
            background: transparent; color: #666; font-size: 0.8rem; cursor: pointer;
        }
        .reset-btn:hover { border-color: #4f46e5; color: #4f46e5; }

        .toggle-row {
            display: flex; align-items: center; gap: 8px; margin-top: 8px;
            font-size: 0.85rem; color: #666;
        }
        .toggle-row input[type="checkbox"] { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>🔑 Cấu Hình Gemini Live API</h2>

            <div class="form-group">
                <label>1. Gemini API Key</label>
                <input type="password" id="api-key" placeholder="Dán API Key của bạn vào đây...">
                <p class="helper-text">Lấy key miễn phí tại <a href="https://aistudio.google.com/app/api-keys" target="_blank">Google AI Studio</a>.</p>
            </div>

            <div class="form-group">
                <label>2. Chọn Model</label>
                <div class="row-buttons">
                    <button id="scan-btn" class="btn btn-secondary" style="width: 100%;">📡 Dò danh sách Model</button>
                </div>
                <select id="model-select" size="8" style="height: auto; min-height: 180px;">
                    <option value="">-- Nhấn "Dò danh sách Model" để tải --</option>
                </select>
                <div class="toggle-row">
                    <input type="checkbox" id="filter-live" checked>
                    <label for="filter-live" style="font-weight: normal; margin: 0; cursor: pointer;">
                        Chỉ hiển thị model hỗ trợ Live API (⚡)
                    </label>
                </div>
                <input type="text" id="manual-model" placeholder="Hoặc nhập Model ID thủ công" style="margin-top: 8px; font-size: 0.88rem;">
            </div>

            <div class="form-group">
                <label>3. Kiểm tra kết nối</label>
                <button id="test-btn" class="btn btn-primary" style="width: 100%;">⚡ Kiểm tra kết nối</button>
            </div>

            <div id="log-panel" class="log-panel">
                <div class="log-line log-info">[Hệ thống] Sẵn sàng. Vui lòng nhập API Key và bấm "Dò danh sách Model".</div>
            </div>

            <div id="chat-section" class="chat-section">
                <div class="status-bar">
                    <span id="status-indicator" class="status-dot offline"></span>
                    <span id="status-text">Chưa kết nối</span>
                    <button id="reset-btn" class="reset-btn">Ngắt kết nối</button>
                </div>
                <div id="transcript" class="transcript">
                    <div class="message system">Nhấn nút micro để bắt đầu nói chuyện.</div>
                </div>
                <button id="mic-btn" class="mic-btn" disabled>
                    <span id="mic-icon">🎤</span>
                    <span id="mic-label">Bắt đầu nói</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            WS_URL: "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent",
            MODELS_URL: "https://generativelanguage.googleapis.com/v1beta/models",
            INPUT_SAMPLE_RATE: 16000,
            OUTPUT_SAMPLE_RATE: 24000,
            CHUNK_SIZE: 4096,
            SETUP_TIMEOUT_MS: 15000,
        };

        const state = {
            apiKey: null,
            selectedModel: null,
            socket: null,
            isConnected: false,
            isRecording: false,
            audioContext: null,
            mediaStream: null,
            sourceNode: null,
            processorNode: null,
            playbackContext: null,
            nextPlayTime: 0,
            sessionSetupComplete: false,
            allModels: [],
            setupTimeout: null,
        };

        const $ = (id) => document.getElementById(id);
        const apiKeyInput = $("api-key");
        const scanBtn = $("scan-btn");
        const modelSelect = $("model-select");
        const manualModelInput = $("manual-model");
        const filterLive = $("filter-live");
        const testBtn = $("test-btn");
        const chatSection = $("chat-section");
        const resetBtn = $("reset-btn");
        const micBtn = $("mic-btn");
        const micLabel = $("mic-label");
        const micIcon = $("mic-icon");
        const statusIndicator = $("status-indicator");
        const statusText = $("status-text");
        const transcript = $("transcript");
        const logPanel = $("log-panel");

        function addLog(message, type = "info") {
            const div = document.createElement("div");
            div.className = `log-line log-${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logPanel.appendChild(div);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function init() {
            const savedKey = localStorage.getItem("gemini_api_key");
            const savedModel = localStorage.getItem("gemini_model");
            if (savedKey) apiKeyInput.value = savedKey;
            if (savedModel) manualModelInput.value = savedModel;

            scanBtn.addEventListener("click", scanModels);
            testBtn.addEventListener("click", testConnection);
            resetBtn.addEventListener("click", resetConnection);
            micBtn.addEventListener("click", toggleRecording);
            filterLive.addEventListener("change", renderModelList);
            modelSelect.addEventListener("change", () => {
                if (modelSelect.value) manualModelInput.value = modelSelect.value;
            });
        }

        // ==================== DÒ MODEL ====================
        async function scanModels() {
            const key = apiKeyInput.value.trim();
            if (!key) return alert("Vui lòng nhập API Key trước!");

            scanBtn.textContent = "⏳ Đang dò...";
            scanBtn.disabled = true;
            addLog("Bắt đầu dò danh sách model...", "info");

            try {
                const res = await fetch(`${CONFIG.MODELS_URL}?key=${key}&pageSize=200`);
                const data = await res.json();

                if (data.error) throw new Error(data.error.message);
                if (!data.models || data.models.length === 0) throw new Error("Không có model nào được trả về.");

                state.allModels = data.models;
                const liveCount = data.models.filter(m =>
                    m.supportedGenerationMethods && m.supportedGenerationMethods.includes("bidiGenerateContent")
                ).length;

                addLog(`✅ Đã tải ${data.models.length} model (${liveCount} hỗ trợ Live API).`, "success");
                renderModelList();
                scanBtn.textContent = "📡 Dò lại danh sách Model";
            } catch (err) {
                addLog("❌ Lỗi khi dò model: " + err.message, "error");
                addLog("💡 Mẹo: Kiểm tra API Key và đảm bảo bạn đang chạy qua Live Server.", "warning");
                scanBtn.textContent = "📡 Dò lại danh sách Model";
            } finally {
                scanBtn.disabled = false;
            }
        }

        function renderModelList() {
            const onlyLive = filterLive.checked;
            const models = onlyLive
                ? state.allModels.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("bidiGenerateContent"))
                : state.allModels;

            modelSelect.innerHTML = "";
            if (models.length === 0) {
                modelSelect.innerHTML = '<option value="">-- Không có model nào --</option>';
                return;
            }

            models.forEach(m => {
                const isLive = m.supportedGenerationMethods && m.supportedGenerationMethods.includes("bidiGenerateContent");
                const opt = document.createElement("option");
                opt.value = m.name;
                opt.textContent = `${isLive ? "⚡ " : "   "}${m.name}${m.displayName ? " — " + m.displayName : ""}`;
                modelSelect.appendChild(opt);
            });

            if (modelSelect.options.length > 0) {
                modelSelect.selectedIndex = 0;
                manualModelInput.value = modelSelect.value;
            }
        }

        // ==================== KIỂM TRA KẾT NỐI ====================
        function testConnection() {
            const key = apiKeyInput.value.trim();
            let model = manualModelInput.value.trim() || modelSelect.value;

            if (!key) return alert("Vui lòng nhập API Key!");
            if (!model) return alert("Vui lòng chọn hoặc nhập Model!");
            if (!key.startsWith("AIza") && !key.startsWith("AQ.")) return alert("API key không hợp lệ.");

            if (!model.startsWith("models/")) model = "models/" + model;

            state.apiKey = key;
            state.selectedModel = model;
            localStorage.setItem("gemini_api_key", key);
            localStorage.setItem("gemini_model", model);

            addLog("──────────────", "info");
            addLog(`⚡ Bắt đầu kiểm tra kết nối với: ${model}`, "info");
            addLog("Đang mở WebSocket...", "info");

            chatSection.classList.add("active");
            updateStatus("connecting", "Đang kết nối...");
            testBtn.disabled = true;
            testBtn.textContent = "⏳ Đang kiểm tra...";

            connectWebSocket();
        }

        function connectWebSocket() {
            if (state.socket) {
                try { state.socket.close(); } catch(e) {}
                state.socket = null;
            }

            const wsUrl = `${CONFIG.WS_URL}?key=${state.apiKey}`;
            addLog(`🔗 URL: ${wsUrl.replace(state.apiKey, "***KEY***")}`, "raw");

            try {
                state.socket = new WebSocket(wsUrl);
            } catch (err) {
                addLog("❌ Lỗi khởi tạo WebSocket: " + err.message, "error");
                testBtn.disabled = false;
                testBtn.textContent = "⚡ Kiểm tra kết nối";
                return;
            }

            state.socket.onopen = () => {
                addLog("✅ WebSocket đã kết nối. Đang gửi cấu hình model...", "success");
                sendSetupMessage();

                // Timeout 15 giây
                state.setupTimeout = setTimeout(() => {
                    if (!state.sessionSetupComplete) {
                        addLog("⏰ HẾT THỜI GIAN CHỜ (15s). Server không phản hồi setupComplete.", "error");
                        addLog("💡 Nguyên nhân có thể:", "warning");
                        addLog("   1. Model không được hỗ trợ cho API Key của bạn", "warning");
                        addLog("   2. Tài khoản Google Cloud chưa bật Billing", "warning");
                        addLog("   3. Cấu trúc gói setup bị sai", "warning");
                        addLog("👉 Hãy thử chọn model ⚡ khác trong danh sách và bấm 'Kiểm tra kết nối' lại.", "info");
                        updateStatus("offline", "Timeout - Server không phản hồi");
                        try { state.socket.close(); } catch(e) {}
                    }
                }, CONFIG.SETUP_TIMEOUT_MS);
            };

            state.socket.onmessage = handleSocketMessage;
            state.socket.onerror = (err) => {
                addLog("❌ Lỗi WebSocket event: " + (err.message || "Không xác định"), "error");
                updateStatus("offline", "Lỗi kết nối");
            };
            state.socket.onclose = (event) => {
                if (state.setupTimeout) {
                    clearTimeout(state.setupTimeout);
                    state.setupTimeout = null;
                }

                addLog(`WebSocket đóng. Mã: ${event.code}, Lý do: ${event.reason || "Không có"}`, "warning");

                if (event.code === 1007) {
                    addLog("💡 Mã 1007: Sai định dạng message. Kiểm tra lại gói setup.", "warning");
                } else if (event.code === 1008) {
                    addLog("💡 Mã 1008: Model không tồn tại hoặc không hỗ trợ Live API.", "warning");
                } else if (event.code === 1000 && !state.sessionSetupComplete) {
                    addLog("💡 Mã 1000 (đóng bình thường nhưng KHÔNG có setupComplete):", "warning");
                    addLog("   → Model bị từ chối. Thử model ⚡ khác.", "warning");
                }

                state.isConnected = false;
                state.sessionSetupComplete = false;
                updateStatus("offline", "Mất kết nối");
                setMicEnabled(false);
                testBtn.disabled = false;
                testBtn.textContent = "⚡ Kiểm tra kết nối";
            };
        }

        function sendSetupMessage() {
            // Cấu trúc setup chuẩn theo tài liệu Gemini Live API
            const setupMessage = {
                setup: {
                    model: state.selectedModel,
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: {
                                    voiceName: "Kore"
                                }
                            }
                        }
                    },
                    systemInstruction: {
                        parts: [{
                            text: "You are a friendly and patient English conversation partner helping a Vietnamese speaker practice English. Respond in English. Keep responses natural and conversational."
                        }]
                    }
                }
            };

            const jsonStr = JSON.stringify(setupMessage);
            addLog(`📤 Gửi setup (${jsonStr.length} bytes):`, "info");
            addLog(jsonStr, "raw");

            try {
                state.socket.send(jsonStr);
                addLog("✅ Đã gửi. Đang chờ setupComplete từ server...", "info");
            } catch (err) {
                addLog("❌ Lỗi khi gửi setup: " + err.message, "error");
            }
        }

        function handleSocketMessage(event) {
            // Xử lý cả Blob và String
            if (event.data instanceof Blob) {
                event.data.text().then(text => processMessage(text));
            } else {
                processMessage(event.data);
            }
        }

        function processMessage(rawData) {
            addLog(`📥 Nhận (${rawData.length} bytes): ${rawData.substring(0, 300)}${rawData.length > 300 ? "..." : ""}`, "raw");

            let data;
            try {
                data = JSON.parse(rawData);
            } catch (err) {
                addLog("❌ Không parse được JSON: " + err.message, "error");
                return;
            }

            // Setup hoàn tất
            if (data.setupComplete) {
                if (state.setupTimeout) {
                    clearTimeout(state.setupTimeout);
                    state.setupTimeout = null;
                }
                addLog("✅✅✅ SETUP THÀNH CÔNG! Session đã sẵn sàng.", "success");
                addLog("🎤 Bạn có thể bắt đầu nói chuyện.", "success");
                state.isConnected = true;
                state.sessionSetupComplete = true;
                updateStatus("online", "Đã kết nối — Sẵn sàng nói");
                setMicEnabled(true);
                addMessage("system", "Đã kết nối! Nhấn nút micro để bắt đầu nói.");
                testBtn.disabled = false;
                testBtn.textContent = "⚡ Kết nối lại";
                return;
            }

            // Session resumption
            if (data.sessionResumptionUpdate) {
                addLog("🔄 Session resumption update received.", "info");
            }

            // Server content
            if (data.serverContent) {
                const sc = data.serverContent;
                if (sc.modelTurn && sc.modelTurn.parts) {
                    for (const part of sc.modelTurn.parts) {
                        if (part.inlineData && part.inlineData.mimeType && part.inlineData.mimeType.startsWith("audio/pcm")) {
                            playAudioChunk(part.inlineData.data);
                        }
                        if (part.text) addMessage("ai", part.text);
                    }
                }
                if (sc.inputTranscription && sc.inputTranscription.text) {
                    addMessage("user", sc.inputTranscription.text);
                }
                if (sc.turnComplete) {
                    addLog("🔄 Lượt nói hoàn tất.", "info");
                }
            }

            // Lỗi từ server
            if (data.error) {
                addLog("❌ LỖI TỪ SERVER: " + JSON.stringify(data.error), "error");
                addMessage("system", `Lỗi: ${data.error.message || JSON.stringify(data.error)}`);
            }
        }

        // ==================== NGẮT KẾT NỐI ====================
        function resetConnection() {
            if (state.setupTimeout) {
                clearTimeout(state.setupTimeout);
                state.setupTimeout = null;
            }
            if (state.socket) {
                try { state.socket.close(1000, "User reset"); } catch(e) {}
                state.socket = null;
            }
            state.isConnected = false;
            state.sessionSetupComplete = false;
            stopRecording();
            setMicEnabled(false);
            chatSection.classList.remove("active");
            updateStatus("offline", "Chưa kết nối");
            addLog("🔌 Đã ngắt kết nối theo yêu cầu.", "info");
        }

        // ==================== GHI ÂM ====================
        async function toggleRecording() {
            if (state.isRecording) stopRecording();
            else await startRecording();
        }

        async function startRecording() {
            if (!state.isConnected || !state.sessionSetupComplete) {
                addMessage("system", "Chưa kết nối. Vui lòng kiểm tra kết nối trước.");
                return;
            }

            try {
                state.mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { channelCount: 1, sampleRate: CONFIG.INPUT_SAMPLE_RATE, echoCancellation: true, noiseSuppression: true }
                });
                state.audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: CONFIG.INPUT_SAMPLE_RATE });
                state.sourceNode = state.audioContext.createMediaStreamSource(state.mediaStream);
                state.processorNode = state.audioContext.createScriptProcessor(CONFIG.CHUNK_SIZE, 1, 1);

                state.processorNode.onaudioprocess = (e) => {
                    if (!state.isRecording || !state.socket || state.socket.readyState !== WebSocket.OPEN) return;
                    const inputData = e.inputBuffer.getChannelData(0);
                    const pcm16 = floatTo16BitPCM(inputData);
                    const base64 = arrayBufferToBase64(pcm16.buffer);
                    state.socket.send(JSON.stringify({
                        realtimeInput: { audio: { data: base64, mimeType: `audio/pcm;rate=${CONFIG.INPUT_SAMPLE_RATE}` } }
                    }));
                };

                state.sourceNode.connect(state.processorNode);
                state.processorNode.connect(state.audioContext.destination);
                state.isRecording = true;
                updateMicButton(true);
                addMessage("system", "🎤 Đang ghi âm...");
            } catch (err) {
                addMessage("system", `Không thể truy cập micro: ${err.message}`);
            }
        }

        function stopRecording() {
            state.isRecording = false;
            updateMicButton(false);
            if (state.processorNode) { state.processorNode.disconnect(); state.processorNode = null; }
            if (state.sourceNode) { state.sourceNode.disconnect(); state.sourceNode = null; }
            if (state.audioContext) { state.audioContext.close(); state.audioContext = null; }
            if (state.mediaStream) { state.mediaStream.getTracks().forEach(t => t.stop()); state.mediaStream = null; }
            if (state.socket && state.socket.readyState === WebSocket.OPEN) {
                state.socket.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
            }
        }

        function playAudioChunk(base64Data) {
            if (!state.playbackContext) {
                state.playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: CONFIG.OUTPUT_SAMPLE_RATE });
                state.nextPlayTime = state.playbackContext.currentTime;
            }
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) float32Array[i] = int16Array[i] / 32768.0;

            const audioBuffer = state.playbackContext.createBuffer(1, float32Array.length, CONFIG.OUTPUT_SAMPLE_RATE);
            audioBuffer.copyToChannel(float32Array, 0);
            const source = state.playbackContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(state.playbackContext.destination);
            const currentTime = state.playbackContext.currentTime;
            if (state.nextPlayTime < currentTime) state.nextPlayTime = currentTime;
            source.start(state.nextPlayTime);
            state.nextPlayTime += audioBuffer.duration;
        }

        function floatTo16BitPCM(float32Array) {
            const buffer = new ArrayBuffer(float32Array.length * 2);
            const view = new DataView(buffer);
            for (let i = 0; i < float32Array.length; i++) {
                let s = Math.max(-1, Math.min(1, float32Array[i]));
                s = s < 0 ? s * 0x8000 : s * 0x7FFF;
                view.setInt16(i * 2, s, true);
            }
            return new Int16Array(buffer);
        }

        function arrayBufferToBase64(buffer) {
            let binary = "";
            const bytes = new Uint8Array(buffer);
            const chunkSize = 8192;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        function addMessage(type, text) {
            const div = document.createElement("div");
            div.className = `message ${type}`;
            div.textContent = text;
            transcript.appendChild(div);
            transcript.scrollTop = transcript.scrollHeight;
        }

        function updateStatus(status, text) {
            statusIndicator.className = `status-dot ${status}`;
            statusText.textContent = text;
        }

        function updateMicButton(active) {
            if (active) {
                micBtn.classList.add("active");
                micIcon.textContent = "⏹";
                micLabel.textContent = "Dừng nói";
            } else {
                micBtn.classList.remove("active");
                micIcon.textContent = "🎤";
                micLabel.textContent = "Bắt đầu nói";
            }
        }

        function setMicEnabled(enabled) { micBtn.disabled = !enabled; }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
